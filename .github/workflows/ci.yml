name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.architecture }} (${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - architecture: arm64
            runner: macos-26
            preset: default
          - architecture: arm64
            runner: macos-26
            preset: double
          - architecture: x86_64
            runner: macos-26-intel
            preset: default

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ninja
        run: brew install ninja

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Collect diffusion tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: diffusion-${{ matrix.architecture }}-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/analysis/diffusion-v1.json

  windows:
    name: Windows x86_64 (${{ matrix.preset }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      matrix:
        preset: [default, double]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Collect diffusion tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: diffusion-windows-x86_64-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/analysis/diffusion-v1.json
