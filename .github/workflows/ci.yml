name: CI

# Pull requests into develop run the float32 suite on macOS arm64 and
# Windows (MSVC), without the tests labelled `slow`. Releases and hotfixes
# (pull requests into main), pushes to main, and manual runs run everything:
# float64, macOS Intel, slow tests, and the macOS consumer. Each matrix below
# repeats that condition, because `env` is not available in `strategy`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.architecture }} (${{ matrix.preset }})
    runs-on: ${{ matrix.architecture == 'x86_64' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 15
    strategy:
      matrix:
        architecture: [arm64, x86_64]
        preset: [default, double]
        exclude: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main' || github.head_ref == 'feature/163-offline-throughput') && '[{"architecture":"x86_64","preset":"double"}]' || '[{"architecture":"x86_64"},{"preset":"double"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ninja
        run: brew install ninja

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: >
          ctest --preset ${{ matrix.preset }} --parallel 4
          ${{ (github.event_name != 'pull_request' || github.base_ref == 'main' || github.head_ref == 'feature/163-offline-throughput') && ' ' || '--label-exclude slow' }}

      - name: Collect diffusion tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: diffusion-${{ matrix.architecture }}-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/analysis/diffusion-v1.json

      - name: Extract compact diffusion-equivalence summary
        run: |
          python3 tools/extract_diffusion_equivalence.py \
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result \
            --output build/${{ matrix.preset }}/diffusion-equivalence.json

      - name: Upload diffusion-equivalence summary
        uses: actions/upload-artifact@v6
        with:
          name: diffusion-equivalence-${{ matrix.architecture }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/diffusion-equivalence.json

      - name: Collect tail tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: tail-${{ matrix.architecture }}-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/tail-analyzer-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/tail-analyzer-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/tail-analyzer-contract/render-result/analysis/tail-v1.json

      - name: Extract compact tail-equivalence summary
        run: |
          python3 tools/extract_tail_equivalence.py \
            build/${{ matrix.preset }}/tests/tail-analyzer-contract/render-result \
            --output build/${{ matrix.preset }}/tail-equivalence.json

      - name: Upload tail-equivalence summary
        uses: actions/upload-artifact@v6
        with:
          name: tail-equivalence-${{ matrix.architecture }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/tail-equivalence.json

      - name: Collect tail-v2 tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: tail-v2-${{ matrix.architecture }}-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/tail-analyzer-v2-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/tail-analyzer-v2-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/tail-analyzer-v2-contract/render-result/analysis/tail-v2.json

      - name: Extract compact tail-v2-equivalence summary
        run: |
          python3 tools/extract_tail_v2_equivalence.py \
            build/${{ matrix.preset }}/tests/tail-analyzer-v2-contract/render-result \
            --output build/${{ matrix.preset }}/tail-v2-equivalence.json

      - name: Upload tail-v2-equivalence summary
        uses: actions/upload-artifact@v6
        with:
          name: tail-v2-equivalence-${{ matrix.architecture }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/tail-v2-equivalence.json

      - name: Collect modulation-v1 tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: modulation-${{ matrix.architecture }}-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/modulation-analyzer-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/modulation-analyzer-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/modulation-analyzer-contract/render-result/analysis/modulation-v1.json

      - name: Extract compact modulation-equivalence summary
        run: |
          python3 tools/extract_modulation_equivalence.py \
            build/${{ matrix.preset }}/tests/modulation-analyzer-contract/render-result \
            --output build/${{ matrix.preset }}/modulation-equivalence.json

      - name: Upload modulation-equivalence summary
        uses: actions/upload-artifact@v6
        with:
          name: modulation-equivalence-${{ matrix.architecture }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/modulation-equivalence.json

  windows:
    name: Windows x86_64 (${{ matrix.preset }})
    runs-on: windows-2022
    timeout-minutes: 15
    # Pin cl: the runner's MinGW GCC stays on PATH after the MSVC developer
    # environment is set up, and CMake would otherwise pick it (issue #162).
    env:
      CC: cl
      CXX: cl
    strategy:
      matrix:
        preset: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main' || github.head_ref == 'feature/163-offline-throughput') && '["default","double"]' || '["default"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      # Puts cl, link, and the Windows SDK on PATH for the Ninja presets.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: >
          ctest --preset ${{ matrix.preset }} --parallel 4
          ${{ (github.event_name != 'pull_request' || github.base_ref == 'main' || github.head_ref == 'feature/163-offline-throughput') && ' ' || '--label-exclude slow' }}

      - name: Collect diffusion tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: diffusion-windows-x86_64-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result/analysis/diffusion-v1.json

      - name: Extract compact diffusion-equivalence summary
        run: |
          python tools/extract_diffusion_equivalence.py `
            build/${{ matrix.preset }}/tests/diffusion-analyzer-contract/render-result `
            --output build/${{ matrix.preset }}/diffusion-equivalence.json

      - name: Upload diffusion-equivalence summary
        uses: actions/upload-artifact@v6
        with:
          name: diffusion-equivalence-windows-x86_64-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/diffusion-equivalence.json

      - name: Collect tail tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: tail-windows-x86_64-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/tail-analyzer-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/tail-analyzer-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/tail-analyzer-contract/render-result/analysis/tail-v1.json

      - name: Extract compact tail-equivalence summary
        run: |
          python tools/extract_tail_equivalence.py `
            build/${{ matrix.preset }}/tests/tail-analyzer-contract/render-result `
            --output build/${{ matrix.preset }}/tail-equivalence.json

      - name: Upload tail-equivalence summary
        uses: actions/upload-artifact@v6
        with:
          name: tail-equivalence-windows-x86_64-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/tail-equivalence.json

      - name: Collect tail-v2 tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: tail-v2-windows-x86_64-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/tail-analyzer-v2-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/tail-analyzer-v2-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/tail-analyzer-v2-contract/render-result/analysis/tail-v2.json

      - name: Extract compact tail-v2-equivalence summary
        run: |
          python tools/extract_tail_v2_equivalence.py `
            build/${{ matrix.preset }}/tests/tail-analyzer-v2-contract/render-result `
            --output build/${{ matrix.preset }}/tail-v2-equivalence.json

      - name: Upload tail-v2-equivalence summary
        uses: actions/upload-artifact@v6
        with:
          name: tail-v2-equivalence-windows-x86_64-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/tail-v2-equivalence.json

      - name: Collect modulation-v1 tolerance evidence
        uses: actions/upload-artifact@v6
        with:
          name: modulation-windows-x86_64-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/modulation-analyzer-contract/render-result/render.json
            build/${{ matrix.preset }}/tests/modulation-analyzer-contract/render-result/resolved.json
            build/${{ matrix.preset }}/tests/modulation-analyzer-contract/render-result/analysis/modulation-v1.json

      - name: Extract compact modulation-equivalence summary
        run: |
          python tools/extract_modulation_equivalence.py `
            build/${{ matrix.preset }}/tests/modulation-analyzer-contract/render-result `
            --output build/${{ matrix.preset }}/modulation-equivalence.json

      - name: Upload modulation-equivalence summary
        uses: actions/upload-artifact@v6
        with:
          name: modulation-equivalence-windows-x86_64-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/modulation-equivalence.json

  consumer:
    name: Consumer ${{ matrix.os }} (${{ matrix.precision }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        # The default generator per runner: Visual Studio (MSVC) on Windows,
        # Makefiles with Apple Clang on macOS.
        os: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main' || github.head_ref == 'feature/163-offline-throughput') && '["macos-26","windows-2022"]' || '["windows-2022"]') }}
        precision: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main' || github.head_ref == 'feature/163-offline-throughput') && '["float","double"]' || '["float"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Fetch the commit under test the way consumers fetch a release: as a
      # GitHub source archive, so neither Git nor Git LFS is involved.
      - name: Configure
        run: >
          cmake -S tests/consumer -B build/consumer
          -DRVRBOTRON_URL=https://github.com/${{ github.repository }}/archive/${{ github.event.pull_request.head.sha || github.sha }}.tar.gz
          -DRVRBOTRON_SAMPLE_DOUBLE=${{ matrix.precision == 'double' && 'ON' || 'OFF' }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/consumer --config Release

      - name: Test
        run: ctest --test-dir build/consumer --build-config Release --output-on-failure

  # TEMPORARY (#163): before/after MSVC numbers for the PR. Remove before
  # merging.
  benchmark-msvc:
    name: Benchmark MSVC (temporary, #163)
    runs-on: windows-2022
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build before and after
        run: |
          git worktree add ../before ${{ github.event.pull_request.base.sha }}
          for tree in ../before .; do
            cmake -S $tree -B $tree/build/msvc -G "Visual Studio 17 2022" -A x64 -DRVRBOTRON_BUILD_TESTS=OFF
            cmake --build $tree/build/msvc --config Release --target rvrbotron
          done

      - name: Render, compare, and benchmark Cloud
        run: |
          python - <<'PY'
          import array, random, struct
          random.seed(163)
          rate, frames = 48000, 48000 * 32
          data = array.array("f", (random.uniform(-0.3, 0.3) for _ in range(frames * 2))).tobytes()
          fmt = struct.pack("<HHIIHH", 3, 2, rate, rate * 8, 8, 32)
          with open("in.wav", "wb") as f:
              f.write(b"RIFF" + struct.pack("<I", 4 + 8 + len(fmt) + 8 + len(data)) + b"WAVE")
              f.write(b"fmt " + struct.pack("<I", len(fmt)) + fmt)
              f.write(b"data" + struct.pack("<I", len(data)) + data)
          PY
          cat > cloud.json <<'JSON'
          {"formatVersion": 2, "seed": 42, "composition": {"stages": [
           {"type": "split", "channels": 16, "strategy": "stereo-halves"},
           {"type": "diffuser", "steps": 6, "totalMs": 150},
           {"type": "feedback-loop", "delayMinMs": 160, "delayMaxMs": 320, "rt60Sec": 9.0,
            "damping": {"highRatio": 0.35, "highHz": 3500, "lowRatio": 0.75, "lowHz": 250},
            "modulation": {"depthMs": 0.8, "rateHz": 0.25, "shape": "smoothed-random"}},
           {"type": "downmix", "strategy": "orthogonal-rows", "widthDeg": 120}], "wetOnly": true}}
          JSON
          before=../before/build/msvc/Release/rvrbotron.exe
          after=build/msvc/Release/rvrbotron.exe
          "$before" render --input in.wav --config cloud.json --block-size 128 --output out-before
          "$after" render --input in.wav --config cloud.json --block-size 128 --output out-after
          for block in 1 777; do
            "$after" render --input in.wav --config cloud.json --block-size $block --output out-after-$block
          done
          {
            echo "## Cloud on MSVC (windows-2022)"
            cmp out-before/output.wav out-after/output.wav && echo "- before vs after, block 128: byte-identical" || echo "- before vs after, block 128: DIFFERENT"
            for block in 1 777; do
              cmp out-after/output.wav out-after-$block/output.wav && echo "- after, block $block vs 128: byte-identical" || echo "- after, block $block vs 128: DIFFERENT"
            done
            for round in 1 2; do
              for side in before after; do
                bin=$([ $side = before ] && echo "$before" || echo "$after")
                "$bin" benchmark --resolved out-before/resolved.json --measure-seconds 30 > bench.json
                python -c "import json; d = json.load(open('bench.json')); print(f'- round $round, $side: medianUtilization {d[\"medianUtilization\"]:.5f}')"
              done
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  compare-diffusion-equivalence:
    name: Compare diffusion equivalence across platforms
    runs-on: ubuntu-latest
    needs: [macos, windows]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download diffusion-equivalence summaries
        uses: actions/download-artifact@v6
        with:
          pattern: diffusion-equivalence-*
          path: diffusion-equivalence

      - name: Compare across platforms by precision
        run: |
          python3 tools/compare_diffusion_equivalence.py \
            diffusion-equivalence/*/diffusion-equivalence.json \
            --tolerances tools/diffusion_tolerances_v1.json

  compare-tail-equivalence:
    name: Compare tail equivalence across platforms
    runs-on: ubuntu-latest
    needs: [macos, windows]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download tail-equivalence summaries
        uses: actions/download-artifact@v6
        with:
          pattern: tail-equivalence-*
          path: tail-equivalence

      - name: Compare across platforms by precision
        run: |
          python3 tools/compare_tail_equivalence.py \
            tail-equivalence/*/tail-equivalence.json \
            --tolerances tools/tail_tolerances_v1.json

  compare-tail-v2-equivalence:
    name: Compare tail-v2 equivalence across platforms
    runs-on: ubuntu-latest
    needs: [macos, windows]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download tail-v2-equivalence summaries
        uses: actions/download-artifact@v6
        with:
          pattern: tail-v2-equivalence-*
          path: tail-v2-equivalence

      - name: Compare across platforms by precision
        run: |
          python3 tools/compare_tail_v2_equivalence.py \
            tail-v2-equivalence/*/tail-v2-equivalence.json \
            --tolerances tools/tail_tolerances_v2.json

  compare-modulation-equivalence:
    name: Compare modulation equivalence across platforms
    runs-on: ubuntu-latest
    needs: [macos, windows]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download modulation-equivalence summaries
        uses: actions/download-artifact@v6
        with:
          pattern: modulation-equivalence-*
          path: modulation-equivalence

      - name: Compare across platforms by precision
        run: |
          python3 tools/compare_modulation_equivalence.py \
            modulation-equivalence/*/modulation-equivalence.json \
            --tolerances tools/modulation_tolerances_v1.json
